openapi: 3.1.0
info:
  title: API HOPE International
  version: 1.0.0
  description: |
    API REST de la plateforme HOPE International (Express 5 + MySQL).
    Document ecrit a la main a partir de `apps/api/routes/*.js` : a mettre a jour avec les routes.
    Validation et page HTML : `npm run docs:api -w @hope/api` (genere `apps/api/docs/index.html`).

    **Authentification** : `POST /auth/login` pose le JWT dans le cookie httpOnly `hope_session`
    (`SameSite=Lax`, `Secure` en production). L'en-tete `Authorization: Bearer <jwt>` reste accepte (scripts).

    **CSRF** : toute requete d'ecriture (POST, PUT, PATCH, DELETE) authentifiee par cookie doit porter
    `X-Requested-With: XMLHttpRequest`, sinon 403.

    **Langue** : les messages d'erreur sont traduits selon `Accept-Language` (fr, en, es).

    **Erreurs** : corps `{ "error": "message" }`, plus `errors` (validation express-validator), `code` ou `details`.

    **Limites** : 500 requetes / 15 min par IP en production ; connexion et inscription 20 / 15 min ;
    dons 30 / 15 min ; formulaires publics 10 / heure.
  contact:
    name: HOPE International
  license:
    name: Proprietaire
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:5000/api
    description: Developpement local
security: []
tags:
  - name: Sante
    description: Sonde de disponibilite (healthcheck Docker, supervision)
  - name: Public
    description: Referentiels, contenus publies, formulaires et agenda
  - name: Authentification
    description: Session par cookie httpOnly, profil et mots de passe
  - name: Dons
    description: Dons, recus et dons mensuels
  - name: Webhooks
    description: Notifications des prestataires de paiement (signees)
  - name: Administration
    description: Back-office ; chaque route exige une permission RBAC (packages/shared/src/rbac.js)

paths:
  /health:
    get:
      tags: [Sante]
      summary: Etat de l'API et de la base
      operationId: getHealth
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: API et base disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
        "503":
          description: Base injoignable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [degraded] }

  /health/details:
    get:
      tags: [Sante]
      summary: Etat detaille (supervision) - jeton X-Health-Token ou permission manage_it
      operationId: getHealthDetails
      security: [{ healthToken: [] }, { cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Base injoignable (detail dans le corps)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  # ---------------------------------------------------------------- Public
  /meta:
    get:
      tags: [Public]
      summary: Referentiels (regions, statuts, prestataires actifs, limites de don, organisation)
      operationId: getMeta
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Referentiels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
  /impact:
    get:
      tags: [Public]
      summary: Chiffres d'impact publics (beneficiaires, formations, dons)
      operationId: getImpact
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Indicateurs agreges
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /content/{type}:
    get:
      tags: [Public]
      summary: Contenus publies d'un type
      operationId: listContent
      parameters:
        - $ref: "#/components/parameters/ContentType"
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "200":
          description: Liste des contenus publies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Content" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /content/{type}/{id}:
    get:
      tags: [Public]
      summary: Detail d'un contenu publie
      operationId: getContent
      parameters:
        - $ref: "#/components/parameters/ContentType"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Contenu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Content" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /messages:
    post:
      tags: [Public]
      summary: Formulaire de contact
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, content]
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email }
                subject: { type: string, minLength: 3, maxLength: 255 }
                content: { type: string, minLength: 10, maxLength: 5000 }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /applications:
    post:
      tags: [Public]
      summary: Candidature (benevolat / adhesion)
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, motivation]
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 40 }
                region: { $ref: "#/components/schemas/Region" }
                motivation: { type: string, minLength: 30, maxLength: 5000 }
                interests:
                  type: array
                  description: Poles d'interet indicatifs (referentiel INTEREST_AREAS)
                  items: { type: string, enum: [terrain, sante, education, entrepreneuriat, communication, collecte, informatique, administration, autre] }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /events:
    get:
      tags: [Public]
      summary: Agenda des evenements publies (inscription de l'utilisateur si connecte)
      operationId: listEvents
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Evenements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
  /events/mine:
    get:
      tags: [Public]
      summary: Evenements auxquels l'utilisateur connecte est inscrit
      operationId: myEvents
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Evenements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events/{id}:
    get:
      tags: [Public]
      summary: Detail d'un evenement
      operationId: getEvent
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Evenement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{id}/registration:
    post:
      tags: [Public]
      summary: S'inscrire a un evenement
      operationId: registerEvent
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "201": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Evenement complet, passe ou deja inscrit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Public]
      summary: Se desinscrire d'un evenement
      operationId: unregisterEvent
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Authentification
  /auth/register:
    post:
      tags: [Authentification]
      summary: Creer un compte membre
      description: Reponse identique que l'email existe ou non (pas d'enumeration des comptes).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                email: { type: string, format: email }
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion (pose le cookie de session)
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Connecte ; cookie `hope_session` pose
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "hope_session=<jwt>; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/forgot-password:
    post:
      tags: [Authentification]
      summary: Demander un lien de reinitialisation
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/reset-password:
    post:
      tags: [Authentification]
      summary: Reinitialiser le mot de passe avec le jeton recu par email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /auth/logout:
    post:
      tags: [Authentification]
      summary: Deconnexion (efface le cookie)
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200": { $ref: "#/components/responses/Message" }
  /auth/logout-all:
    post:
      tags: [Authentification]
      summary: Fermer toutes les sessions du compte
      operationId: logoutAll
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Authentification]
      summary: Profil de l'utilisateur connecte
      operationId: getMe
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Authentification]
      summary: Modifier son nom ou son telephone
      operationId: updateMe
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                phone: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Profil mis a jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/change-password:
    post:
      tags: [Authentification]
      summary: Changer de mot de passe (ferme les autres sessions)
      operationId: changePassword
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { $ref: "#/components/schemas/Password" }
      responses:
        "200":
          description: Mot de passe modifie
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- Dons
  /payment/donations:
    post:
      tags: [Dons]
      summary: Creer un don (carte Stripe ou Mobile Money)
      description: |
        Carte : renvoie `clientSecret` (a confirmer avec Stripe.js). Mobile Money : renvoie `redirectUrl`
        (page du prestataire). Un donateur anonyme fournit `donorName` et `donorEmail`.
      operationId: createDonation
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, provider]
              properties:
                amount: { type: number, exclusiveMinimum: 0, description: "EUR (carte) ou XAF (Mobile Money), dans les limites de /meta" }
                provider: { type: string, enum: [stripe, mobile_money, notchpay, flutterwave] }
                frequency: { type: string, enum: [once, monthly], default: once }
                projectId: { type: integer, minimum: 1 }
                donorName: { type: string, minLength: 2, maxLength: 150 }
                donorEmail: { type: string, format: email }
                phone: { type: string, maxLength: 40, description: Numero Mobile Money (E.164) }
      responses:
        "201":
          description: Don cree (statut pending)
          content:
            application/json:
              schema:
                type: object
                required: [paymentId, provider, receiptToken]
                properties:
                  paymentId: { type: integer }
                  provider: { type: string }
                  receiptToken: { type: string, minLength: 48, maxLength: 48 }
                  clientSecret: { type: string }
                  redirectUrl: { type: string, format: uri }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Prestataire non configure ou indisponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /payment/receipts/{token}:
    get:
      tags: [Dons]
      summary: Etat d'un don et de son recu (page de remerciement, sans compte)
      operationId: getReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptToken"
      responses:
        "200":
          description: Don
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Donation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payment/receipts/{token}/confirm:
    post:
      tags: [Dons]
      summary: Relire le statut chez le prestataire au retour de paiement
      operationId: confirmReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId: { type: string, maxLength: 64 }
                status: { type: string }
      responses:
        "200":
          description: Don (statut a jour)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Donation" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payment/receipts/{token}/pdf:
    get:
      tags: [Dons]
      summary: Recu fiscal PDF
      operationId: downloadReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptToken"
      responses:
        "200":
          description: Recu PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Don non confirme (pas de recu)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /payment/receipts/{token}/cancel-subscription:
    post:
      tags: [Dons]
      summary: Arreter un don mensuel depuis le lien du recu
      operationId: cancelSubscriptionByReceipt
      parameters:
        - $ref: "#/components/parameters/ReceiptToken"
      responses:
        "200":
          description: Don mensuel arrete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  alreadyCanceled: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
  /payment/receipts/annual/{year}/pdf:
    get:
      tags: [Dons]
      summary: Recapitulatif annuel des dons confirmes du compte
      operationId: downloadAnnualReceipt
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: year
          in: path
          required: true
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payment/mine:
    get:
      tags: [Dons]
      summary: Dons et dons mensuels du compte connecte
      operationId: getMyDonations
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Dons du compte
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /payment/subscriptions/{id}:
    delete:
      tags: [Dons]
      summary: Arreter un de ses dons mensuels
      operationId: cancelSubscription
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^sub_[A-Za-z0-9]+$" }
        - $ref: "#/components/parameters/Csrf"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Webhooks
  /payment/webhook:
    post:
      tags: [Webhooks]
      summary: Webhook Stripe (corps brut, en-tete Stripe-Signature)
      operationId: stripeWebhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/WebhookRejected" }
  /payment/notchpay/webhook:
    post:
      tags: [Webhooks]
      summary: Webhook Notch Pay (HMAC-SHA256 du corps brut)
      operationId: notchpayWebhook
      parameters:
        - name: x-notch-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/WebhookRejected" }
  /payment/flutterwave/webhook:
    post:
      tags: [Webhooks]
      summary: Webhook Flutterwave (en-tete verif-hash)
      operationId: flutterwaveWebhook
      parameters:
        - name: verif-hash
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/WebhookReceived" }
        "400": { $ref: "#/components/responses/WebhookRejected" }

  # ---------------------------------------------------------------- Administration
  /admin/stats:
    get:
      tags: [Administration]
      summary: Tableau de bord (permission view_stats)
      operationId: adminStats
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/roles:
    get:
      tags: [Administration]
      summary: Roles et permissions, roles attribuables par l'utilisateur
      operationId: adminRoles
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/logs:
    get:
      tags: [Administration]
      summary: Journal d'activite (view_logs)
      operationId: adminLogs
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/system:
    get:
      tags: [Administration]
      summary: Etat du systeme et configuration restante (manage_it)
      operationId: adminSystem
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/regional:
    get:
      tags: [Administration]
      summary: Vue regionale (manage_regional)
      operationId: adminRegional
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RegionQuery"
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/reports/annual:
    get:
      tags: [Administration]
      summary: Rapport annuel (view_stats)
      operationId: adminAnnualReport
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/YearQuery"
      responses:
        "200": { $ref: "#/components/responses/AnyObject" }
