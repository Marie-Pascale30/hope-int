components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hope_session
      description: JWT pose par POST /auth/login. Ecritures - ajouter l'en-tete X-Requested-With - XMLHttpRequest.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternative au cookie pour les scripts (pas de controle CSRF).
    healthToken:
      type: apiKey
      in: header
      name: X-Health-Token
      description: Jeton de supervision (variable HEALTH_TOKEN de l'API).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ContentType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [projects, news, testimonials] }
    ReceiptToken:
      name: token
      in: path
      required: true
      description: Jeton de recu (48 caracteres hexadecimaux)
      schema: { type: string, pattern: "^[0-9a-fA-F]{48}$" }
    Csrf:
      name: X-Requested-With
      in: header
      required: false
      description: Obligatoire (valeur XMLHttpRequest) pour une ecriture authentifiee par cookie.
      schema: { type: string, enum: [XMLHttpRequest] }
    RegionQuery:
      name: region
      in: query
      schema: { $ref: "#/components/schemas/Region" }
    YearQuery:
      name: year
      in: query
      schema: { type: integer, minimum: 2000, maximum: 2100 }
    Page:
      name: page
      in: query
      description: Sans page, la reponse est un tableau complet ; avec page, un objet pagine.
      schema: { type: integer, minimum: 1, maximum: 100000 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1 }
    DonationStatus:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/DonationStatus" }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    ProjectIdQuery:
      name: projectId
      in: query
      schema: { type: integer, minimum: 1 }
    ProviderQuery:
      name: provider
      in: query
      schema: { type: string, enum: [stripe, notchpay, flutterwave] }

  requestBodies:
    ReviewNote:
      content:
        application/json:
          schema:
            type: object
            properties:
              reviewNote: { type: [string, "null"], maxLength: 2000 }
    ContentForm:
      required: true
      description: JSON, ou multipart/form-data avec un champ fichier `image`. Champs obligatoires a la creation - projects (title, description), news (title, content), testimonials (author, content).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ContentInput" }
        multipart/form-data:
          schema:
            allOf:
              - $ref: "#/components/schemas/ContentInput"
              - type: object
                properties:
                  image: { type: string, format: binary }
    EventForm:
      required: true
      description: JSON, ou multipart/form-data avec un champ fichier `image`. title, description, location et start_at sont obligatoires a la creation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/EventInput" }
        multipart/form-data:
          schema:
            allOf:
              - $ref: "#/components/schemas/EventInput"
              - type: object
                properties:
                  image: { type: string, format: binary }

  responses:
    Message:
      description: Operation effectuee
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    AnyObject:
      description: Reponse JSON (structure detaillee dans le controleur correspondant)
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    PagedList:
      description: Tableau (sans `page`) ou objet pagine (avec `page`)
      content:
        application/json:
          schema:
            oneOf:
              - type: array
                items: { type: object, additionalProperties: true }
              - $ref: "#/components/schemas/Page"
    ValidationError:
      description: Requete invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Non connecte ou session expiree
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Permission manquante, ou en-tete CSRF absent
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Trop de requetes (limiteur)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhookReceived:
      description: Notification acceptee
      content:
        application/json:
          schema:
            type: object
            properties:
              received: { type: boolean }
    WebhookRejected:
      description: Signature invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: {}
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              msg: { type: string }
    Page:
      type: object
      properties:
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    Password:
      type: string
      minLength: 8
      maxLength: 100
      description: Au moins 8 caracteres, une lettre et un chiffre
    Region:
      type: string
      enum: [Adamaoua, Centre, Est, Extrême-Nord, Littoral, Nord, Nord-Ouest, Ouest, Sud, Sud-Ouest]
    Roles:
      type: array
      minItems: 1
      items:
        type: string
        enum: [directrice_generale, conseiller, responsable_rh, responsable_finance, organisatrice, responsable_it, directrice_regionale, secretaire_generale, membre, admin]
    BulkIds:
      type: array
      minItems: 1
      maxItems: 100
      items: { type: integer, minimum: 1 }
    DonationStatus:
      type: string
      enum: [pending, succeeded, failed, canceled, refunded, disputed, review]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        phone: { type: [string, "null"] }
        region: { type: [string, "null"] }
        mustChangePassword: { type: boolean }
    Meta:
      type: object
      properties:
        regions: { type: array, items: { $ref: "#/components/schemas/Region" } }
        projectStatuses: { type: array, items: { type: string } }
        interestAreas:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
        providers:
          type: object
          properties:
            stripe: { type: boolean }
            mobileMoney: { type: boolean }
            mobileMoneyProvider: { type: [string, "null"], enum: [notchpay, flutterwave, null] }
            notchpay: { type: boolean }
            flutterwave: { type: boolean }
        donationLimits:
          type: object
          additionalProperties:
            type: object
            properties:
              min: { type: number }
              max: { type: number }
        xafPerEur: { type: number }
        organization:
          type: object
          additionalProperties: { type: string }
    Content:
      type: object
      description: Projet / campagne, actualite ou temoignage (champs selon le type)
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: [string, "null"] }
        description: { type: string }
        content: { type: string }
        author: { type: string }
        role_label: { type: [string, "null"] }
        image_url: { type: [string, "null"] }
        image_alt: { type: [string, "null"] }
        status: { type: string, enum: [planifie, en_cours, termine] }
        region: { type: [string, "null"] }
        goal_amount: { type: [number, "null"] }
        project_id: { type: [integer, "null"] }
        published: { type: [boolean, integer] }
        created_at: { type: string, format: date-time }
      additionalProperties: true
    ContentInput:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        summary: { type: string, maxLength: 500 }
        description: { type: string }
        content: { type: string }
        author: { type: string, maxLength: 150 }
        role_label: { type: string, maxLength: 150 }
        image_alt: { type: string, maxLength: 255 }
        status: { type: string, enum: [planifie, en_cours, termine] }
        region: { $ref: "#/components/schemas/Region" }
        budget: { type: number, minimum: 0 }
        goal_amount: { type: number, minimum: 0 }
        beneficiaries: { type: integer, minimum: 0 }
        trainees: { type: integer, minimum: 0 }
        credits_granted: { type: integer, minimum: 0 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        project_id: { type: integer, minimum: 1 }
        published: { type: boolean }
    Event:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        region: { type: [string, "null"] }
        start_at: { type: string, format: date-time }
        end_at: { type: [string, "null"], format: date-time }
        capacity: { type: [integer, "null"] }
        remaining_spots: { type: [integer, "null"] }
        registered: { type: boolean, description: Present si l'utilisateur est connecte }
        image_url: { type: [string, "null"] }
        project_id: { type: [integer, "null"] }
      additionalProperties: true
    EventInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        description: { type: string, minLength: 10 }
        location: { type: string, minLength: 2, maxLength: 255 }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, maximum: 100000 }
        region: { $ref: "#/components/schemas/Region" }
        project_id: { type: integer, minimum: 1 }
        image_alt: { type: string, maxLength: 255 }
    Donation:
      type: object
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/DonationStatus" }
        amount: { type: number }
        currency: { type: string, enum: [eur, xaf] }
        method: { type: string, enum: [card, mobile_money] }
        provider: { type: string }
        frequency: { type: string, enum: [once, monthly] }
        receiptNumber: { type: [string, "null"] }
      additionalProperties: true
