# Identifiants lus dans le fichier .env a la racine (modele : .env.example).
# Preproduction : docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
services:
  mysql:
    image: mysql:26
    container_name: hope_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_DATABASE: hope_platform
      MYSQL_USER: ${MYSQL_USER:-hope}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD dans .env}
    # Accessible uniquement depuis la machine hote (jamais depuis le reseau).
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Outil de developpement uniquement : demarre avec `docker compose --profile dev up`.
  phpmyadmin:
    image: phpmyadmin:5
    container_name: hope_phpmyadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PMA_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-hope}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: hope_platform
      CORS_ORIGIN: http://localhost:3001
      FRONTEND_URL: http://localhost:3001
      API_PUBLIC_URL: http://localhost:5000/api
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/apps/api/uploads
    # Meme sonde que le HEALTHCHECK de l'image (apps/api/Dockerfile) ; /api/health interroge MySQL.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    environment:
      # Rendu serveur des pages publiques : l'API est jointe par le reseau interne Docker.
      API_INTERNAL_URL: http://backend:5000/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Sauvegardes planifiees (optionnel) : docker compose --profile backup up -d backup
  # Dump MySQL + archive des images televersees (cron, 02:30 par defaut), rotation 7 quotidiennes /
  # 4 hebdomadaires, chiffrement et envoi S3 optionnels : voir infra/backup/backup.env.example.
  backup:
    image: alpine:3.22
    profiles: ["backup"]
    restart: unless-stopped
    env_file:
      - path: ./infra/backup/backup.env
        required: false
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-hope}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: hope_platform
      BACKUP_DIR: /backups
      UPLOADS_DIR: /data/uploads
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
    volumes:
      - ./infra/backup:/opt/backup:ro
      - backend_uploads:/data/uploads:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/opt/backup/cron-entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  backend_uploads:
  backups:
